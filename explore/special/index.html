<script>
  // 先声明配置与初始化监听，再异步加载库：
  // 保证库执行时 lazyLoadOptions 已就绪，避免 async 脚本抢先执行导致自初始化失败
  // https://www.npmjs.com/package/vanilla-lazyload
  // Set the options globally
  // to make LazyLoad self-initialize
  window.lazyLoadOptions = {
    elements_selector: ".lazy",
    callback_loaded: (el) => {
      el.classList.add('loaded');
      // {% image %} 没有 .lazy-box 包裹，回退到父元素查找加载图标
      const wrapper = el.closest('.lazy-box') || el.parentElement;
      const icon = wrapper?.querySelector('.lazy-icon');
      if (icon) icon.remove();
    }
  };
  // 监听初始化事件，获取 LazyLoad 实例
  window.addEventListener(
    "LazyLoad::Initialized",
    function (event) {
      window.lazyLoadInstance = event.detail.instance;
    },
    false
  );
  document.addEventListener('DOMContentLoaded', function () {
    window.lazyLoadInstance?.update();
  });

  // 兜底：动态插入的 .lazy 元素（如站点自定义脚本在 update() 之后追加的图片）
  // 不会被 vanilla-lazyload 自动扫描，未注册的 img.lazy 会被 CSS opacity:0 永久隐藏。
  // MutationObserver 检测到新增 .lazy 元素后自动调用 update() 重新注册。
  if (window.MutationObserver) {
    window.lazyMutationObserver = new MutationObserver((mutations) => {
      if (window.lazyMutationObserver._pending) return;
      const hasLazy = mutations.some((m) =>
        Array.prototype.some.call(m.addedNodes, (node) =>
          node.nodeType === 1 &&
          (node.matches?.('.lazy') || !!node.querySelector?.('.lazy'))
        )
      );
      if (!hasLazy) return;
      window.lazyMutationObserver._pending = requestAnimationFrame(() => {
        window.lazyMutationObserver._pending = null;
        window.lazyLoadInstance?.update();
      });
    });
    window.lazyMutationObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  }

  window.wrapLazyloadImages = (container) => {
    if (typeof container === 'string') {
      container = document.querySelector(container);
    }
    if (!container) return;

    const images = container.querySelectorAll('img');
    images.forEach((img) => {
      if (img.classList.contains('lazy')) return;

      const src = img.getAttribute('src');
      if (!src) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'lazy-box';

      const newImg = img.cloneNode();
      newImg.removeAttribute('src');
      newImg.setAttribute('data-src', src);
      newImg.classList.add('lazy');

      const icon = document.createElement('div');
      icon.className = 'lazy-icon';

      wrapper.appendChild(newImg);
      wrapper.appendChild(icon);

      img.replaceWith(wrapper);
    });

    // 通知 LazyLoad 更新
    if (window.lazyLoadInstance?.update) {
      window.lazyLoadInstance.update();
    }
  }

<script>
  (function () {
    // 兜底看门狗独立于插件初始化：3 秒内未完成 reveal 时强制显示 .slide-up 内容
    let fallbackApplied = false;
    const revealFallback = () => {
      if (fallbackApplied) return;
      fallbackApplied = true;
      document.documentElement.classList.add('sr-fallback');
    };
    const watchdog = setTimeout(() => revealFallback(), 3000);

    stellar.initPlugin(() => {
      const els = Array.prototype.slice.call(document.querySelectorAll('.slide-up'));
      if (els.length === 0) {
        clearTimeout(watchdog);
        return;
      }

    // 吸顶/固定定位容器内的元素始终在视口内（或由容器控制显隐），
    // 但 ScrollReveal 按文档坐标判断可见性，会误判这类元素为不可见，
    // 导致带锚点/恢复滚动位置打开页面时组件一直不显示。
    // 解决方式：以最近的吸顶/固定祖先作为该组元素的容器，
    // 使可见性判断恒成立，入场动画保留且不再依赖主文档滚动。
    const findPinnedContainer = (el) => {
      let node = el;
      while (node && node.nodeType === 1) {
        const pos = window.getComputedStyle(node).position;
        if (pos === 'sticky' || pos === 'fixed') return node;
        node = node.parentElement;
      }
      return null;
    };

    // 最近的滚动容器（overflow-y: auto/scroll）
    // 吸顶容器内可能存在内部滚动容器（如侧栏 .widgets），
    // 若直接用吸顶容器做 reveal 容器，折叠区下方的元素永远不会进入视口，导致一直不显示。
    const findScrollContainer = (el) => {
      let node = el.parentElement;
      while (node && node.nodeType === 1) {
        const oy = window.getComputedStyle(node).overflowY;
        if (oy === 'auto' || oy === 'scroll') return node;
        node = node.parentElement;
      }
      return null;
    };

    const pinnedGroups = new Map(); // 容器 -> 元素列表
    const targets = [];
    els.forEach((el) => {
      const pinned = findPinnedContainer(el);
      if (pinned) {
        // 优先使用最近的滚动容器，其次才用吸顶容器
        const container = findScrollContainer(el) || pinned;
        const group = pinnedGroups.get(container) || [];
        group.push(el);
        pinnedGroups.set(container, group);
      } else {
        targets.push(el);
      }
    });
    if (pinnedGroups.size === 0 && targets.length === 0) {
      clearTimeout(watchdog);
      return;
    }

    const slideUp = {
      distance: `8px`,
      duration: `1000`,
      interval: `100`,
      scale: `1`,
      opacity: 0,
      easing: "ease-out"
    };

    utils.js(`https://gcore.jsdelivr.net/npm/scrollreveal@4.0/dist/scrollreveal.min.js`, { defer: true })
      .then(() => {
        if (fallbackApplied) return;
        if (typeof ScrollReveal !== 'function') {
          revealFallback();
          return;
        }
        try {
          const sr = ScrollReveal();
          if (targets.length > 0) {
            sr.reveal(targets, { ...slideUp });
          }
          pinnedGroups.forEach((group, container) => {
            sr.reveal(group, { ...slideUp, container: container });
          });
          clearTimeout(watchdog);
        } catch (err) {
          console.error('[Plugin scrollreveal] 初始化失败:', err);
          revealFallback();
        }
      })
      .catch((err) => {
        console.error('[Plugin scrollreveal] 加载失败:', err);
        revealFallback();
      });
    }, 'scrollreveal');
  })();
</script>
